[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Fundação offline para avaliação de acurácia e incerteza entre alternativas"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
llm-benchmark = "benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
